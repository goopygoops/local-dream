name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_ROOT: ${{ github.workspace }}/android-ndk
      QNN_SDK_ROOT: ${{ github.workspace }}/qnn-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK cmdline-tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip wget
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          rm cmdline-tools.zip
          mv cmdline-tools latest

      - name: Accept licenses and install SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;34.0.0" \
            "ndk;28.0.13003508" \
            "cmake;3.22.1"

      - name: Download QNN SDK
        if: secrets.QNN_SDK_URL != ''
        run: |
          mkdir -p $QNN_SDK_ROOT
          curl -L "${{ secrets.QNN_SDK_URL }}" -o /tmp/qnn_sdk.tar.gz
          tar -xzf /tmp/qnn_sdk.tar.gz -C $QNN_SDK_ROOT --strip-components=1
          echo "QNN_SDK_ROOT=$QNN_SDK_ROOT" >> $GITHUB_ENV
          echo "QNN SDK version: $(ls $QNN_SDK_ROOT)"

      - name: Build native library
        if: secrets.QNN_SDK_URL != ''
        working-directory: app/src/main/cpp
        run: |
          export QNN_SDK_ROOT=$QNN_SDK_ROOT
          export ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT
          bash build.sh

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleBasicRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalDream-basic-release
          path: app/build/outputs/apk/basic/release/*.apk
          retention-days: 14
